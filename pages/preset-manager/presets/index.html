<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>NovelAI 预设管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#presetList">跳到预设列表</a>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 4.5h6.5V11H5zM12.5 13H19v6.5h-6.5z" />
              <path d="M14 4.5h5v5M5 14h5v5.5H5z" />
            </svg>
          </div>
          <div>
            <div class="title-line">
              <h1>预设管理</h1>
              <span id="totalBadge" class="total-badge">0 个预设</span>
            </div>
            <p>整理 NovelAI 提示词，并让修改立即用于聊天画图。</p>
          </div>
        </div>

        <div class="topbar-actions">
          <span id="syncStatus" class="sync-status" aria-live="polite">
            <span class="sync-dot" aria-hidden="true"></span>
            <span>正在连接</span>
          </span>
          <button id="refreshButton" class="button button-secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" />
            </svg>
            刷新
          </button>
          <button id="newPresetButton" class="button button-primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            新建预设
          </button>
        </div>
      </header>

      <main id="mainContent" class="workspace">
        <aside class="category-panel" aria-label="预设分类">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">分类</span>
              <h2>预设资料夹</h2>
            </div>
            <span class="drop-hint">可拖入</span>
          </div>
          <nav id="categoryList" class="category-list" aria-label="预设分类列表"></nav>
          <div class="sidebar-note">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
            </svg>
            <p>“待分类”用于接收历史的“其他”与孤立预设，不会影响已有命令。</p>
          </div>
        </aside>

        <section class="content-panel" aria-labelledby="currentCategoryTitle">
          <div class="list-toolbar">
            <div class="category-summary">
              <span class="eyebrow">当前分类</span>
              <div class="category-title-row">
                <h2 id="currentCategoryTitle">待分类</h2>
                <span id="visibleCount" class="visible-count">0</span>
              </div>
              <p id="currentCategoryDescription">尚未归入四个正式分类的预设</p>
            </div>

            <label class="search-field" for="searchInput">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-4-4" />
              </svg>
              <span class="sr-only">搜索预设</span>
              <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="搜索名称或提示词"
              />
              <kbd>Ctrl K</kbd>
            </label>
          </div>

          <div id="bulkBar" class="bulk-bar" hidden>
            <div class="bulk-selection">
              <span class="selection-indicator" aria-hidden="true"></span>
              <strong id="selectedCount">已选择 0 项</strong>
              <button id="clearSelectionButton" class="text-button" type="button">取消选择</button>
            </div>
            <div class="bulk-actions">
              <label for="bulkCategory" class="sr-only">目标分类</label>
              <select id="bulkCategory" class="select-control"></select>
              <button id="bulkMoveButton" class="button button-secondary" type="button">移动</button>
              <button id="bulkDeleteButton" class="button button-danger-ghost" type="button">删除</button>
            </div>
          </div>

          <div class="preset-table" aria-busy="false">
            <div class="table-header" role="row">
              <div class="select-cell" role="columnheader">
                <input id="selectVisible" type="checkbox" aria-label="选择当前筛选结果" />
              </div>
              <div role="columnheader">预设名称</div>
              <div role="columnheader">提示词内容</div>
              <div class="actions-heading" role="columnheader">操作</div>
            </div>
            <div id="presetList" class="preset-list" role="rowgroup" tabindex="-1"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="loadingState" class="loading-state">
      <span class="spinner" aria-hidden="true"></span>
      <strong>正在加载预设</strong>
      <span>通过 AstrBot 安全连接读取插件配置…</span>
    </div>

    <dialog id="editorDialog" class="drawer-dialog">
      <form id="editorForm" class="drawer-form" novalidate>
        <header class="drawer-header">
          <div>
            <span class="eyebrow">预设详情</span>
            <h2 id="editorTitle">新建预设</h2>
          </div>
          <button id="closeEditorButton" class="icon-button" type="button" aria-label="关闭编辑面板">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </header>

        <div class="drawer-body">
          <label class="form-field" for="presetName">
            <span>预设名称</span>
            <input id="presetName" name="name" maxlength="100" autocomplete="off" required />
            <small>在画图命令中输入这个名称即可展开提示词。</small>
          </label>

          <label class="form-field" for="presetCategory">
            <span>分类</span>
            <select id="presetCategory" name="category" required></select>
          </label>

          <label class="form-field form-field-grow" for="presetPrompt">
            <span>提示词内容</span>
            <textarea
              id="presetPrompt"
              name="prompt"
              maxlength="20000"
              spellcheck="false"
              required
              placeholder="例如：1girl, solo, white hair, blue eyes"
            ></textarea>
            <small><span id="promptLength">0</span> / 20,000 字符</small>
          </label>

          <div id="editorError" class="form-error" role="alert" hidden></div>
        </div>

        <footer class="drawer-footer">
          <button id="cancelEditorButton" class="button button-secondary" type="button">取消</button>
          <button id="savePresetButton" class="button button-primary" type="submit">保存预设</button>
        </footer>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="confirm-dialog">
      <div class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 14H7L6 7" />
        </svg>
      </div>
      <h2>删除预设？</h2>
      <p id="confirmMessage">删除后无法恢复。</p>
      <div class="confirm-actions">
        <button id="cancelDeleteButton" class="button button-secondary" type="button">取消</button>
        <button id="confirmDeleteButton" class="button button-danger" type="button">确认删除</button>
      </div>
    </dialog>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
