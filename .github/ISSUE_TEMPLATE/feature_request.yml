name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
