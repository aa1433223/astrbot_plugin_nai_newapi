name: Bug 反馈
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么，期望发生什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 /画图 ...
        2. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: "例如 1.5.1"
    validations:
      required: true
  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      placeholder: "例如 4.10.5"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 报错
      render: shell
    validations:
      required: false
