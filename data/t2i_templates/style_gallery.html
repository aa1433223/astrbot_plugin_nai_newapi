<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      min-height: 300px;
      padding: 54px 56px 62px;
      color: #222a35;
      background: #f4f0ea;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 34px;
      padding-bottom: 24px;
      border-bottom: 2px solid #d9d1c6;
    }
    .kicker {
      margin-bottom: 10px;
      color: #9d674d;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0;
      color: #17212d;
      font-size: 52px;
      line-height: 1.12;
      letter-spacing: -.035em;
    }
    .summary {
      margin: 0 0 4px;
      color: #6d746e;
      font-size: 23px;
      line-height: 1.45;
      text-align: right;
      white-space: nowrap;
    }
    .style-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }
    .style-card {
      overflow: hidden;
      border: 1px solid #ded6cb;
      border-radius: 22px;
      background: #fffdf9;
      box-shadow: 0 10px 24px rgba(81, 67, 54, .10);
    }
    .preview {
      display: block;
      width: 100%;
      height: 294px;
      object-fit: cover;
      background: #e8e2da;
    }
    .preview-empty {
      display: grid;
      height: 294px;
      place-items: center;
      align-content: center;
      gap: 10px;
      color: #8a8177;
      background:
        linear-gradient(135deg, transparent 48%, #d8d0c5 49%, #d8d0c5 51%, transparent 52%),
        #eee9e2;
      background-size: 24px 24px;
      font-size: 20px;
      font-weight: 650;
    }
    .preview-empty span { font-size: 36px; opacity: .8; }
    .card-footer {
      display: flex;
      min-height: 96px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
    }
    .style-name {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #202b38;
      font-size: 30px;
      font-weight: 750;
      line-height: 1.25;
    }
    .current {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      color: #fffaf5;
      background: #ad6c4e;
      font-size: 18px;
      font-weight: 700;
    }
    .single {
      width: 100%;
      max-width: 1020px;
      margin: 0 auto;
    }
    .single .style-card { border-radius: 28px; }
    .single .preview,
    .single .preview-empty { height: 620px; }
    .single .card-footer { min-height: 126px; padding: 30px 34px; }
    .single .style-name { font-size: 40px; }
    .empty-note {
      padding: 72px 24px;
      border: 2px dashed #d5cbbf;
      border-radius: 22px;
      color: #77736d;
      background: #fffdf9;
      font-size: 26px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div>
      <div class="kicker">NOVELAI STYLE LIBRARY</div>
      <h1>{{ title }}</h1>
    </div>
    <p class="summary">{{ summary }}</p>
  </header>

  {% if items %}
  <main class="{% if single %}single{% endif %}">
    <div class="style-grid">
      {% for item in items %}
      <article class="style-card">
        {% if item.preview_data %}
        <img class="preview" src="{{ item.preview_data | safe }}" alt="{{ item.name }} 示例图" />
        {% else %}
        <div class="preview-empty"><span>◌</span><div>暂无示例图</div></div>
        {% endif %}
        <footer class="card-footer">
          <div class="style-name">{{ item.name }}</div>
          {% if item.is_current %}<div class="current">当前画风</div>{% endif %}
        </footer>
      </article>
      {% endfor %}
    </div>
  </main>
  {% else %}
  <div class="empty-note">暂时没有找到匹配的画风</div>
  {% endif %}
</body>
</html>
